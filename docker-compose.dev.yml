# Development override: hot-reload images, source bind mounts, and directly exposed ports
services:
  api:
    image: ${IMAGE:-matchmaker}-api:${VERSION:-latest}-dev
    build:
      dockerfile: Dockerfile.dev
    environment:
      GIN_MODE: debug
    volumes:
      - ./backend:/app
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${API_PORT:-8080}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ${IMAGE:-matchmaker}-frontend:${VERSION:-latest}-dev
    build:
      dockerfile: Dockerfile.dev
    environment:
      PORT: ${FRONTEND_PORT:-3000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"

  db:
    ports:
      - "${DB_PORT:-5432}:5432"   # expose for local DB tools