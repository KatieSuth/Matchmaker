name: matchmaker

# Cap per-container log size so logs can't fill the host disk
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    logging: *default-logging
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - datestyle=ISO,YMD
      - -c
      - statement_timeout=30s
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - lock_timeout=5s
    container_name: db
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Golang Gin API ──────────────────────────────────────────
  api:
    image: ${IMAGE:-matchmaker}-api:${VERSION:-latest}
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.25}
        APP_PORT: ${API_PORT:-8080}
    container_name: api
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: ${API_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL_TESTS: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:${DB_PORT:-5432}/${POSTGRES_DB}
      # Public URLs derived from DOMAIN — override by setting the var in .env
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-${DOMAIN:-matchmaker.localhost}}
      FRONTEND_URL: ${FRONTEND_URL:-https://${DOMAIN:-matchmaker.localhost}}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-https://${DOMAIN:-matchmaker.localhost}/api/auth/discord_redirect}
      DISCORD_API_URL: ${DISCORD_API_URL:-https://discord.com/api}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "/server", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Next.js Frontend ────────────────────────────────────────
  frontend:
    image: ${IMAGE:-matchmaker}-frontend:${VERSION:-latest}
    logging: *default-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
        APP_PORT: ${FRONTEND_PORT:-3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${DOMAIN:-matchmaker.localhost}/api}
        NEXT_PUBLIC_FRONTEND_DOMAIN: ${NEXT_PUBLIC_FRONTEND_DOMAIN:-${DOMAIN:-matchmaker.localhost}}
        NEXT_PUBLIC_COOKIE_AUTH_EXPIRE_LIMIT: ${REFRESH_EXPIRE_LIMIT:-604800}
        NEXT_PUBLIC_FEEDBACK_URL: ${NEXT_PUBLIC_FEEDBACK_URL:-https://github.com/KatieSuth/Matchmaker/issues}
    container_name: frontend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # Derived from DOMAIN / REFRESH_EXPIRE_LIMIT — override by setting in .env
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${DOMAIN:-matchmaker.localhost}/api}
      NEXT_PUBLIC_FRONTEND_DOMAIN: ${NEXT_PUBLIC_FRONTEND_DOMAIN:-${DOMAIN:-matchmaker.localhost}}
      NEXT_PUBLIC_COOKIE_AUTH_EXPIRE_LIMIT: ${REFRESH_EXPIRE_LIMIT:-604800}
      NEXT_PUBLIC_FEEDBACK_URL: ${NEXT_PUBLIC_FEEDBACK_URL:-https://github.com/KatieSuth/Matchmaker/issues}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${FRONTEND_PORT:-3000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:${CADDY_VERSION:-2-alpine}
    logging: *default-logging
    container_name: caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-matchmaker.localhost}
      API_PORT: ${API_PORT:-8080}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.20.0.0/16}

volumes:
  postgres_data:
  caddy_data:
  caddy_config: