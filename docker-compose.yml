name: ${COMPOSE_PROJECT_NAME:-matchmaker}

# Cap per-container log size so logs can't fill the host disk
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    logging: *default-logging
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - datestyle=ISO,YMD
      - -c
      - statement_timeout=30s
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - lock_timeout=5s
    container_name: db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Golang Gin API ──────────────────────────────────────────
  api:
    image: ${IMAGE:-matchmaker}-api:${VERSION:-latest}
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.25}
        APP_PORT: ${API_PORT:-8080}
    container_name: api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${API_PORT:-8080}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Next.js Frontend ────────────────────────────────────────
  frontend:
    image: ${IMAGE:-matchmaker}-frontend:${VERSION:-latest}
    logging: *default-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-20}
        APP_PORT: ${FRONTEND_PORT:-3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://matchmaker.localhost/api}
        NEXT_PUBLIC_FRONTEND_DOMAIN: ${NEXT_PUBLIC_FRONTEND_DOMAIN:-matchmaker.localhost}
        NEXT_PUBLIC_COOKIE_AUTH_EXPIRE_LIMIT: ${NEXT_PUBLIC_COOKIE_AUTH_EXPIRE_LIMIT:-604800}
    container_name: frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${FRONTEND_PORT:-3000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:${CADDY_VERSION:-2-alpine}
    logging: *default-logging
    container_name: caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.20.0.0/16}

volumes:
  postgres_data:
  caddy_data:
  caddy_config: