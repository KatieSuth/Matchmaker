services:
  db-test:
    image: postgres:18-alpine
    container_name: matchmaker-db-test
    environment:
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
      - POSTGRES_DB=matchmaker_test
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d matchmaker_test"]
      interval: 3s
      timeout: 3s
      retries: 5