# Ephemeral Postgres + Go test runner for the test suite.
# Usage: docker compose -f docker-compose.test.yml run --rm test
# Usage: make test-docker
services:
  db-test:
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    container_name: matchmaker-db-test
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: matchmaker_test
    volumes:
      - /var/lib/postgresql  # anonymous volume, removed by `down -v`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d matchmaker_test"]
      interval: 3s
      timeout: 3s
      retries: 5

  test:
    image: golang:${GO_VERSION:-1.25}-alpine
    working_dir: /app
    volumes:
      - ./backend:/app:ro
    environment:
      CGO_ENABLED: "0"
      DATABASE_URL_TESTS: postgres://testuser:testpass@db-test:5432/matchmaker_test
      # The defaults below are test-only stand-ins so CI runs without a .env file.
      COOKIE_HASH_KEY: ${COOKIE_HASH_KEY:-0101010101010101010101010101010101010101010101010101010101010101}
      COOKIE_ENCRYPT_KEY: ${COOKIE_ENCRYPT_KEY:-0202020202020202020202020202020202020202020202020202020202020202}
      JWT_SECRET: ${JWT_SECRET:-0303030303030303030303030303030303030303030303030303030303030303}
      DISCORD_API_URL: ${DISCORD_API_URL:-https://discord.com/api}
    command: go test -p 1 -mod=vendor ./internal/...
    depends_on:
      db-test:
        condition: service_healthy