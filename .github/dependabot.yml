version: 2

# Keeps SHA-pinned GitHub Actions and digest-pinned base images current.
# Updates are grouped per ecosystem so each week produces at most a few PRs.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
