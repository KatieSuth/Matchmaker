name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --- BACKEND (GO) ---
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Run Go Tests with Filtered Coverage
        working-directory: ./backend/internal
        run: |
          # 1. Identify packages excluding db and test_util
          PKGS=$(go list ./... | grep -vE "db|test_util")
          
          # 2. Run tests on those packages
          go test -v -coverprofile=coverage.out $PKGS
          
          # 3. Use sed to remove mock_store.go from the final report
          sed -i '/mock_store.go/d' coverage.out
          
          # 4. Generate a summary for the GitHub Action UI
          echo "### Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/internal/coverage.out
          retention-days: 7
  # --- FRONTEND (NEXT.JS) ---
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Next.js Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Next.js Build Check
        working-directory: ./frontend
        run: npm run build
        env:
          # Next.js often needs these at build time to prevent errors
          NODE_ENV: production