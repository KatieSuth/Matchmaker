name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --- BACKEND (GO) ---
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Start Test Database
        working-directory: .
        run: |
          docker compose -f docker-compose.test.yml up -d
          # Give Postgres a few seconds to initialize
          sleep 5

      - name: Run Go Tests with Filtered Coverage
        working-directory: ./backend/internal
        env:
          # Database link for your test_util package 
          DATABASE_URL_TESTS: "postgres://testuser:testpass@localhost:5432/matchmaker_test?sslmode=disable"
          
          # Server Config 
          PORT: 8080
          GIN_MODE: release
          
          # Security Keys (Dummy values for testing) 
          COOKIE_HASH_KEY: "12345678901234567890123456789012"
          COOKIE_ENCRYPT_KEY: "12345678901234567890123456789012"
          JWT_SECRET: "12345678901234567890123456789012"
          
          # OAuth & CORS (Not used by unit tests, but required for init) 
          DISCORD_CLIENT_ID: "mock_id"
          DISCORD_CLIENT_SECRET: "mock_secret"
          DISCORD_REDIRECT_URI: "http://localhost:8080/callback"
          FRONTEND_URL: "http://localhost:3000"
        run: |
          PKGS=$(go list ./... | grep -vE "db|test_util")
          go test -v -coverprofile=coverage.out $PKGS
          sed -i '/mock_store.go/d' coverage.out
          echo "### Backend Coverage Summary" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/internal/coverage.out
          retention-days: 7

      - name: Stop Test Database
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.test.yml down
  # --- FRONTEND (NEXT.JS) ---
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Next.js Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Next.js Build Check
        working-directory: ./frontend
        run: npm run build
        env:
          # Next.js often needs these at build time to prevent errors
          NODE_ENV: production