name: Frontend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Next.js Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Next.js Build Check
        working-directory: ./frontend
        run: npm run build
        env:
          # Next.js often needs these at build time to prevent errors
          NODE_ENV: production