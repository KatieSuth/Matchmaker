openapi: 3.1.0
info:
  title: MatchmakerAPI
  version: 1.0.0
  description: >
    REST API for Matchmaker. Authentication is handled via Discord OAuth2.
    After completing the OAuth2 flow, clients receive a short-lived JWT access token
    and a long-lived HttpOnly refresh token cookie.

    Production (behind Cloudflare): when `ORIGIN_VERIFY_SECRET` is set, requests must
    include a matching `X-Origin-Verify` header (injected by the edge Worker). Missing
    or wrong values return 403. `GET /health` is exempt for platform probes. Local
    Compose leaves the secret unset, so this gate is inactive in development.

tags:
  - name: health
    description: Service health
  - name: auth
    description: Authentication via Discord OAuth2
  - name: users
    description: User profile operations
  - name: games
    description: Game catalogue
  - name: events
    description: Event group and team lifecycle
  - name: registrations
    description: Event registration management

paths:

  /health:
    get:
      tags: [health]
      summary: Health check
      operationId: health
      description: >
        Always reachable without auth. Also exempt from the production
        `X-Origin-Verify` gate so Cloud Run / Docker probes succeed.
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------

  /auth/login:
    get:
      tags: [auth]
      summary: Initiate Discord OAuth2 login
      operationId: login
      description: >
        Generates a CSRF state token, stores it in a signed `oauth_state` cookie,
        and redirects the browser to Discord's authorization endpoint.
      responses:
        "307":
          description: Redirect to Discord authorization URL
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: Discord OAuth2 authorization URL
            Set-Cookie:
              schema:
                type: string
              description: >
                `oauth_state` — signed, HttpOnly, Secure, 5-minute TTL.
                Contains the CSRF state value.
        "500":
          description: Failed to generate state or encode cookie

  /auth/discord_redirect:
    get:
      tags: [auth]
      summary: Discord OAuth2 callback
      operationId: discordCallback
      description: >
        Handles the redirect from Discord after the user authorizes the application.
        Validates the state parameter against the `oauth_state` cookie, exchanges the
        authorization code for a Discord token, fetches the Discord user, upserts the
        local user record, and encrypts the Discord refresh token into `api_links`.
        Issues a short-lived one-time code (OTC) and redirects the browser to the
        frontend callback URL.
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code returned by Discord
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: CSRF state value returned by Discord; must match the `oauth_state` cookie
          schema:
            type: string
      responses:
        "302":
          description: >
            Redirect to `{frontendURL}/auth/callback?otc={otc}&new_user={bool}`.
            The frontend should POST the OTC to `/auth/complete` to receive tokens.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "401":
          description: Missing or invalid `oauth_state` cookie, state mismatch, or failed code exchange
        "500":
          description: Discord API unreachable, malformed Discord response, failed to upsert user, or failed to persist the Discord refresh token

  /auth/complete:
    post:
      tags: [auth]
      summary: Exchange one-time code for tokens
      operationId: completeAuth
      description: >
        Consumes a one-time code (OTC) issued during the Discord callback and returns
        a JWT access token. Also sets an HttpOnly `refresh_token` cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otc]
              properties:
                otc:
                  type: string
                  description: One-time code received in the frontend redirect query parameter
                  examples: ["a3f1c2e4b5d6e7f8a9b0c1d2e3f4a5b6"]
      responses:
        "200":
          description: Tokens issued successfully
          headers:
            Set-Cookie:
              schema:
                type: string
              description: >
                `refresh_token` — HttpOnly, Secure, long-lived (default 7 days).
                Used to obtain new access tokens via `/auth/refresh`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "400":
          description: Missing or empty `otc` field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: OTC not found or already consumed
        "500":
          description: Token generation or storage failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      operationId: refreshToken
      description: >
        Reads the `refresh_token` HttpOnly cookie, validates it, and issues a new
        access token plus a rotated refresh token (old token is deleted).
      responses:
        "200":
          description: New access token issued and refresh token rotated
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Rotated `refresh_token` and `auth_session` cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          description: Missing, invalid, or expired refresh token cookie
        "500":
          description: Token generation or storage failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout
      operationId: logout
      description: >
        Deletes the refresh token from the database and clears the `refresh_token`
        and `auth_session` cookies. Idempotent — returns 204 even if already logged out.
      responses:
        "204":
          description: Logged out successfully (or was already logged out)
        "500":
          description: Failed to delete the refresh token from storage

  # ---------------------------------------------------------------------------
  # Users (protected — requires Bearer JWT)
  # ---------------------------------------------------------------------------

  /users/me:
    get:
      tags: [users]
      summary: Get current user profile
      operationId: getUsersMe
      description: Returns the authenticated user's profile.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing or invalid JWT
        "500":
          description: Failed to fetch user from storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [users]
      summary: Update current user profile and games
      operationId: updateUsersMe
      description: >
        Updates profile fields for the authenticated user and upserts the provided
        game entries in a single transaction.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUsersMeRequest"
      responses:
        "200":
          description: Updated user profile and upserted games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUsersMeResponse"
        "400":
          description: Improper JSON, invalid value types, or invalid game payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "500":
          description: Failed to update user profile or games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me/games:
    get:
      tags: [users]
      summary: Get current user's games
      operationId: getUsersMeGames
      description: Returns all games associated with the authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of user games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserGame"
        "401":
          description: Missing or invalid JWT
        "500":
          description: Failed to fetch user games from storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/me/games/{gameId}:
    put:
      tags: [users]
      summary: Create or update current user's game entry
      operationId: upsertUsersMeGame
      description: Creates or updates the authenticated user's game profile for the specified game.
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          description: UUID of the game
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertUsersMeGameRequest"
      responses:
        "204":
          description: User game upserted successfully
        "400":
          description: Invalid payload, invalid `gameId`, invalid rank UUIDs, or invalid rank ordering
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "500":
          description: Failed to upsert user game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [users]
      summary: Remove current user's game entry
      operationId: deleteUsersMeGame
      description: Deletes the authenticated user's game profile for the specified game. Idempotent if the entry does not exist.
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          description: UUID of the game
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: User game deleted successfully
        "400":
          description: Invalid `gameId`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "500":
          description: Failed to delete user game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me/events:
    get:
      tags: [users]
      summary: Get current user's events
      operationId: getUsersMeEvents
      description: >
        Returns event groups for the authenticated user with optional filters
        and keyset pagination.
      security:
        - bearerAuth: []
      parameters:
        - name: hosting
          in: query
          required: false
          description: When true, only include event groups hosted by the current user
          schema:
            type: boolean
        - name: past
          in: query
          required: false
          description: When true, include past events; defaults to upcoming events
          schema:
            type: boolean
        - name: from
          in: query
          required: false
          description: Lower date boundary in YYYY-MM-DD format
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Upper date boundary in YYYY-MM-DD format
          schema:
            type: string
            format: date
        - name: game_id
          in: query
          required: false
          description: Optional game UUID filter
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          description: Pagination cursor returned by a previous request
          schema:
            type: string
        - name: tz
          in: query
          required: true
          description: IANA timezone used to interpret date filters
          schema:
            type: string
            examples: ["America/New_York"]
      responses:
        "200":
          description: Filtered and paginated event groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardEventsResponse"
        "400":
          description: Invalid query params, timezone, dates, game_id, or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "500":
          description: Failed to fetch events from storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Games (protected — requires Bearer JWT)
  # ---------------------------------------------------------------------------

  /games:
    get:
      tags: [games]
      summary: Get all system games
      operationId: getSystemGames
      description: Returns all games defined in the system.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of system games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
        "401":
          description: Missing or invalid JWT
        "500":
          description: Failed to fetch games from storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/ranks:
    get:
      tags: [games]
      summary: Get ranks for a game
      operationId: getGameRanks
      description: Returns all ranks defined for the specified game.
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          description: UUID of the game
          schema:
            type: string
            format: uuid
          examples:
            default:
              value: "987fcdeb-51a2-43d7-b890-123456789abc"
      responses:
        "200":
          description: List of ranks for the game
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameRank"
        "400":
          description: Invalid or unparseable `gameId`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "500":
          description: Failed to fetch ranks from storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/users/{ownerId}:
    get:
      tags: [games]
      summary: Get games for a specific user
      operationId: getUserGames
      description: Returns all game entries for the specified owner user.
      security:
        - bearerAuth: []
      parameters:
        - name: ownerId
          in: path
          required: true
          description: UUID of the user whose games should be returned
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of user games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserGame"
        "400":
          description: Invalid or unparseable `ownerId`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "500":
          description: Failed to fetch user games from storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /games/{gameId}/modes:
    get:
      tags: [games]
      summary: Get game modes for a game
      operationId: getGameModes
      description: Returns all game modes defined for the specified game.
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          description: UUID of the game
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of game modes for the game
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameMode"
        "400":
          description: Invalid or unparseable `gameId`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "500":
          description: Failed to fetch game modes from storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Events (protected — requires Bearer JWT)
  # ---------------------------------------------------------------------------

  /events:
    post:
      tags: [events]
      summary: Create event group
      operationId: createEventGroup
      description: Creates an event group and its scheduled events.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Event group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEventResponse"
        "400":
          description: Invalid payload, invalid UUID, invalid datetime, unknown game mode, or invalid name (too long / invalid characters)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "500":
          description: Failed to create event group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/{groupId}:
    get:
      tags: [events]
      summary: Get event group detail
      operationId: getEventGroup
      description: Returns detailed event group data, including nested events and registrations.
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          description: UUID of the event group
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Event group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventGroupDetail"
        "400":
          description: Invalid or unparseable `groupId`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "404":
          description: Event group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to fetch event group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [events]
      summary: Update event group settings
      operationId: updateEventGroupSettings
      description: Updates editable event group settings (region, subs, sort logic, registration, game mode). Game mode must stay within the same game.
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          description: UUID of the event group
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventGroupSettingsRequest"
      responses:
        "204":
          description: Event group settings updated successfully
        "400":
          description: Invalid `groupId` or invalid request body (including invalid name)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "403":
          description: Only the event host can update settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to update event group settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [events]
      summary: Delete event group
      operationId: deleteEventGroup
      description: Deletes an event group and associated records.
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          description: UUID of the event group
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Event group deleted successfully
        "400":
          description: Invalid or unparseable `groupId`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "403":
          description: Only the event host can delete the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to delete event group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/{groupId}/registration:
    patch:
      tags: [events]
      summary: Update event group registration status
      operationId: updateEventGroupRegistrationStatus
      description: Opens or closes registrations for an event group.
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          description: UUID of the event group
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRegistrationStatusRequest"
      responses:
        "204":
          description: Registration status updated successfully
        "400":
          description: Invalid request, invalid `groupId`, or teams prevent reopening registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "403":
          description: Only the event host can change registration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to update registration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/{groupId}/teams:
    post:
      tags: [events]
      summary: Create teams for event group
      operationId: createTeamsForEventGroup
      description: Creates teams for the event group and closes registration. Best-effort honors mutual duo requests (same Discord name on both registrations) by grouping partners into the same lobby and team when doing so would not worsen skill balance. Returns whether the substitute minimum forced a less even roster.
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          description: UUID of the event group
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Teams created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTeamsResponse"
        "400":
          description: Invalid `groupId`, teams already exist, or insufficient players/subs for matchmaking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "403":
          description: Only the event host can create teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to create teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [events]
      summary: Delete teams for event group
      operationId: deleteTeamsForEventGroup
      description: Deletes lobbies and team assignments for the group. Registration status is unchanged; reopen registration via group settings when ready.
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          description: UUID of the event group
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Teams deleted successfully
        "400":
          description: Invalid `groupId` or no teams exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "403":
          description: Only the event host can delete teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to delete teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------------------------------------------------------------------------
  # Registrations (protected — requires Bearer JWT)
  # ---------------------------------------------------------------------------

  /registrations/group/{groupId}/me:
    put:
      tags: [registrations]
      summary: Create or update current user's registrations for an event group
      operationId: upsertMyGroupRegistrations
      description: Creates or updates the authenticated user's registrations for selected events in the specified group.
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          description: UUID of the event group
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertGroupRegistrationsRequest"
      responses:
        "204":
          description: Group registrations saved successfully
        "400":
          description: Invalid payload, invalid UUIDs, duplicate event IDs, invalid event selection, registration is closed, teams already exist for a deselected game, or game profile is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "404":
          description: Event group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to save registrations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /registrations/{eventId}/me:
    put:
      tags: [registrations]
      summary: Create or update current user's registration
      operationId: upsertMyRegistration
      description: Creates or updates the authenticated user's registration for an event.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          description: UUID of the event
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertRegistrationRequest"
      responses:
        "204":
          description: Registration saved successfully
        "400":
          description: Invalid payload, invalid `eventId`, registration is closed, or game profile is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to save registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [registrations]
      summary: Delete current user's registration
      operationId: deleteMyRegistration
      description: >
        Deletes the authenticated user's registration for an event.
        Rejected with 400 when teams have already been created for the event.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          description: UUID of the event
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Registration deleted successfully
        "400":
          description: Invalid `eventId`, registration is closed, or teams already exist for the event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "404":
          description: Event or registration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to delete registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /registrations/{eventId}/lobby-host:
    post:
      tags: [registrations]
      summary: Set a team player as lobby host
      operationId: setLobbyHostForEvent
      description: >
        Host-only. Assigns a team player as the lobby host for their lobby.
        The player's can_lobby_host preference is not enforced server-side.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          description: UUID of the game (event row)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Lobby host updated successfully
        "400":
          description: Invalid request or player cannot be made lobby host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "403":
          description: Only the event host can change the lobby host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to set lobby host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lobbies/{lobbyId}/join-code:
    patch:
      tags: [lobbies]
      summary: Set or clear a lobby join code / invite path
      operationId: updateLobbyJoinCode
      description: >
        Event-group owner or this lobby's host. Accepts a plain lobby code, a full https
        invite URL for the game's join_link_base host, a schemeless host/path form of that
        URL, or an already-stripped path (leading slash). Full URLs are validated with
        hostname equality (not string prefix) and stored as path+query only (e.g.
        `/LOL?joinCode=…` or `/VAL?joinCode=…`). Nested paths with extra `/` after the
        leading slash are not accepted yet (future consideration). Clients rebuild
        display URLs as join_link_base + join_code.
        Empty string or null clears the join code. The API never returns a prebuilt full URL.
      security:
        - bearerAuth: []
      parameters:
        - name: lobbyId
          in: path
          required: true
          description: UUID of the lobby
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                join_code:
                  type: string
                  nullable: true
                  description: Plain code, full/schemeless invite URL, path suffix, or empty/null to clear
      responses:
        "204":
          description: Join code updated successfully
        "400":
          description: Invalid join code or link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "403":
          description: Only the event host or lobby host can update the join code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lobby not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to update join code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /registrations/{eventId}/player-swap:
    post:
      tags: [registrations]
      summary: Swap two players' placements for a game
      operationId: swapPlayersForEvent
      description: >
        Host-only. Atomically exchanges two players' team/sub/unplaced assignments for one game,
        then recomputes lobby hosts and fairness warnings. Swaps between substitutes and unplaced
        players are not allowed; use the placement move endpoints instead.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          description: UUID of the game (event row)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id_a, user_id_b]
              properties:
                user_id_a:
                  type: string
                  format: uuid
                user_id_b:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Players swapped successfully
        "400":
          description: Invalid request, invalid swap, or insufficient substitutes after swap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "403":
          description: Only the event host can swap players
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to swap players
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /registrations/{eventId}/sub-to-unplaced:
    post:
      tags: [registrations]
      summary: Move a substitute to unplaced
      operationId: moveSubToUnplacedForEvent
      description: >
        Host-only. Removes a substitute from their lobby sub pool and leaves them unplaced
        for this game, then recomputes lobby fairness warnings.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          description: UUID of the game (event row)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Player moved to unplaced successfully
        "400":
          description: Invalid request or move would violate substitute minimums
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "403":
          description: Only the event host can move players
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to move player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /registrations/{eventId}/unplaced-to-subs:
    post:
      tags: [registrations]
      summary: Move an unplaced player to a lobby sub pool
      operationId: moveUnplacedToSubsForEvent
      description: >
        Host-only. Adds a substitute-eligible unplaced player to the sub pool of the given lobby,
        then recomputes lobby fairness warnings.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          description: UUID of the game (event row)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, lobby_id]
              properties:
                user_id:
                  type: string
                  format: uuid
                lobby_id:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Player moved to subs successfully
        "400":
          description: Invalid request, player not substitute-eligible, or insufficient substitutes after move
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "403":
          description: Only the event host can move players
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to move player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /registrations/{eventId}/{userId}:
    delete:
      tags: [registrations]
      summary: Delete another user's registration
      operationId: deleteRegistrationByUserId
      description: >
        Deletes the target user's registration for an event.
        Caller must have permission (for example, event host privileges).
        Rejected with 400 when teams have already been created for the event.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          description: UUID of the event
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          description: UUID of the registration owner to delete
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Registration deleted successfully
        "400":
          description: Invalid `eventId`/`userId`, registration is closed, or teams already exist for the event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT
        "403":
          description: Caller is not permitted to delete this registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event or registration not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to delete registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# =============================================================================
# Components
# =============================================================================

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from `/auth/complete` or `/auth/refresh`

  schemas:

    AccessTokenResponse:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
          description: "Short-lived JWT for use in the `Authorization: Bearer` header"
          examples: ["eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."]

    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [error]
          examples: [error]
        message:
          type: string
          examples: ["Could not generate required tokens"]

    User:
      type: object
      description: Local user record, populated from Discord identity
      required: [id, show_pronouns, created_at, updated_at, new_user]
      properties:
        id:
          type: string
          format: uuid
          description: Internal user UUID
          examples: ["123e4567-e89b-12d3-a456-426614174000"]
        discord_id:
          type: ["string", "null"]
          description: Discord snowflake ID
          examples: ["123456789012345678"]
        discord_name:
          type: ["string", "null"]
          description: Discord username
          examples: ["katie"]
        image_url:
          type: ["string", "null"]
          description: Discord avatar hash
          examples: ["a_1234abcd5678ef90"]
        display_name:
          type: ["string", "null"]
          maxLength: 50
          description: >
            Optional public display name. Max 50 Unicode code points after trim.
            Disallows control characters and paired ASCII < and > (either alone is allowed).
            Null/omitted means no display name; UI falls back to @discord_name.
          examples: ["Ada"]
        pronouns:
          type: ["string", "null"]
          description: User-specified pronouns
          examples: ["she/her"]
        show_pronouns:
          type: boolean
          description: Whether pronouns are shown publicly
          examples: [true]
        created_at:
          type: string
          format: date-time
          description: Timestamp of account creation
          examples: ["2024-01-15T12:00:00Z"]
        updated_at:
          type: string
          format: date-time
          description: Timestamp of last profile update
          examples: ["2024-06-01T08:30:00Z"]
        region:
          type: ["string", "null"]
          description: User's region
          examples: ["AMER-East"]
        new_user:
          type: boolean
          description: True if this account was created during this login
          examples: [false]

    UserGameUpsert:
      type: object
      description: User game payload used when upserting game entries from profile update
      properties:
        game_id:
          type: string
          format: uuid
          description: UUID of the game
        in_game_name:
          type: ["string", "null"]
          description: In-game name or handle
        current_rank:
          type: ["string", "null"]
          format: uuid
          description: UUID of the current rank
        peak_rank:
          type: ["string", "null"]
          format: uuid
          description: UUID of the peak rank
        show_rank:
          type: boolean
          description: Whether rank information is shown publicly

    UpdateUsersMeRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 50
          description: >
            Optional public display name. Max 50 Unicode code points after trim.
            Disallows control characters and paired ASCII < and > (either alone is allowed).
            Empty string clears the display name.
          examples: ["Ada"]
        pronouns:
          type: string
          description: User's pronouns
          examples: ["she/her"]
        show_pronouns:
          type: boolean
          description: Whether pronouns are shown publicly
        region:
          type: string
          description: User's preferred region
          examples: ["AMER-East"]
        games:
          type: array
          description: Game entries to upsert for the user
          items:
            $ref: "#/components/schemas/UserGameUpsert"

    UpsertUsersMeGameRequest:
      type: object
      required: [in_game_name, current_rank, peak_rank, show_rank]
      properties:
        in_game_name:
          type: string
          description: The user's in-game name or tag
        current_rank:
          type: string
          format: uuid
          description: UUID of the user's current rank
        peak_rank:
          type: string
          format: uuid
          description: UUID of the user's peak rank
        show_rank:
          type: boolean
          description: Whether rank information is shown publicly

    UpdateUsersMeResponse:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [games]
          properties:
            games:
              type: array
              items:
                $ref: "#/components/schemas/UserGame"

    UserGame:
      type: object
      description: A game associated with a user, including rank information
      required: [user_id, game_id, game_name, current_rank_name, peak_rank_name, avg_rank_name, show_rank, created_at, updated_at]
      properties:
        user_id:
          type: string
          format: uuid
          description: UUID of the user
          examples: ["123e4567-e89b-12d3-a456-426614174000"]
        game_id:
          type: string
          format: uuid
          description: UUID of the game
          examples: ["987fcdeb-51a2-43d7-b890-123456789abc"]
        game_name:
          type: string
          description: Display name of the game
          examples: ["Valorant"]
        in_game_name:
          type: ["string", "null"]
          description: The user's in-game name or tag
          examples: ["katie#NA1"]
        current_rank:
          type: ["string", "null"]
          format: uuid
          description: UUID of the user's current rank, if set
          examples: ["aabbccdd-1234-5678-abcd-ef0123456789"]
        current_rank_name:
          type: string
          description: Display name of the current rank
          examples: ["Diamond 2"]
        peak_rank:
          type: ["string", "null"]
          format: uuid
          description: UUID of the user's peak rank, if set
          examples: ["aabbccdd-1234-5678-abcd-ef0123456789"]
        peak_rank_name:
          type: string
          description: Display name of the peak rank
          examples: ["Immortal 1"]
        avg_rank:
          type: ["string", "null"]
          format: uuid
          description: UUID of the user's floored average rank, if set
        avg_rank_name:
          type: string
          description: Display name of the floored average rank used for matchmaking
          examples: ["Diamond 3"]
        show_rank:
          type: boolean
          description: Whether rank information is shown publicly
          examples: [true]
        created_at:
          type: string
          format: date-time
          description: Timestamp when this game was added to the user's profile
          examples: ["2024-01-15T12:00:00Z"]
        updated_at:
          type: string
          format: date-time
          description: Timestamp of the last update to this game entry
          examples: ["2024-06-01T08:30:00Z"]

    DashboardEvent:
      type: object
      description: Compact event-group card shown on user dashboards
      required: [id, name, game_name, game_mode, region, event_date, host_id, host_name, host_display_name, registered_count, registration_open]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
          description: >
            Optional custom event-group title. Max 50 Unicode code points after trim.
            Disallows control characters and paired ASCII < and > (either alone is allowed).
            Responses always include this field; "" means no custom name.
        game_name:
          type: string
        game_mode:
          type: string
        region:
          type: string
        event_date:
          type: string
          format: date-time
        host_id:
          type: string
          format: uuid
        host_name:
          type: string
        host_display_name:
          type: string
          description: Host display name when set; otherwise empty.
        registered_count:
          type: integer
          format: int32
        registration_open:
          type: boolean

    DashboardEventsResponse:
      type: object
      required: [event_groups, next_cursor, has_more]
      properties:
        event_groups:
          type: array
          items:
            $ref: "#/components/schemas/DashboardEvent"
        next_cursor:
          type: string
          description: Cursor for the next page; empty if no next page
        has_more:
          type: boolean
          description: True if another page is available

    Game:
      type: object
      description: A game defined in the system
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the game
          examples: ["987fcdeb-51a2-43d7-b890-123456789abc"]
        name:
          type: string
          description: Display name of the game
          examples: ["Valorant"]
        join_link_base:
          type: string
          nullable: true
          description: >
            HTTPS origin used to validate and rebuild lobby invite links (no trailing slash),
            e.g. https://gg.riotgames.com for League of Legends and Valorant.
          examples: ["https://gg.riotgames.com"]
        created_at:
          type: string
          format: date-time
          description: Timestamp when the game was added to the system
          examples: ["2024-01-15T12:00:00Z"]
        updated_at:
          type: string
          format: date-time
          description: Timestamp of the last update to this game
          examples: ["2024-06-01T08:30:00Z"]

    GameRank:
      type: object
      description: A rank tier belonging to a specific game
      required: [id, name, order, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the rank
          examples: ["aabbccdd-1234-5678-abcd-ef0123456789"]
        game_id:
          type: ["string", "null"]
          format: uuid
          description: UUID of the game this rank belongs to
          examples: ["987fcdeb-51a2-43d7-b890-123456789abc"]
        name:
          type: string
          description: Display name of the rank
          examples: ["Diamond 2"]
        order:
          type: integer
          format: int32
          description: Numeric ordering of the rank within the game (ascending)
          examples: [14]
        created_at:
          type: string
          format: date-time
          description: Timestamp when the rank was created
          examples: ["2024-01-15T12:00:00Z"]
        updated_at:
          type: string
          format: date-time
          description: Timestamp of the last update to this rank
          examples: ["2024-06-01T08:30:00Z"]

    GameMode:
      type: object
      description: Game mode definition available under a game
      required: [id, game_id, name, team_size, duration, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        game_id:
          type: string
          format: uuid
        name:
          type: string
        team_size:
          type: integer
          format: int32
        owner_id:
          type: ["string", "null"]
          format: uuid
        duration:
          type: integer
          format: int32
          description: Expected duration in minutes
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SortLogic:
      type: string
      enum: [balanced, ranked]
      default: balanced
      description: Matchmaking mode — balanced mixes skill across lobbies; ranked keeps similar skill together.

    CreateEventRequest:
      type: object
      required: [game_mode_id, region, start_time, sub_min, games_to_run]
      properties:
        game_mode_id:
          type: string
          format: uuid
        region:
          type: string
        start_time:
          type: string
          format: date-time
          description: RFC3339 datetime
        sub_min:
          type: integer
          format: int32
          minimum: 0
        games_to_run:
          type: integer
          format: int32
          minimum: 1
        registration_open:
          type: boolean
        sort_logic:
          $ref: "#/components/schemas/SortLogic"
        name:
          type: string
          maxLength: 50
          description: >
            Optional custom event-group title. Max 50 Unicode code points after trim.
            Disallows control characters and paired ASCII < and > (either alone is allowed).
            Omit or send empty/whitespace to leave unset (stored as null).

    CreateEventResponse:
      type: object
      required: [group_id]
      properties:
        group_id:
          type: string
          format: uuid

    PatchGroupEventScheduleItem:
      type: object
      required: [event_id, start_time, game_mode_id]
      properties:
        event_id:
          type: string
          format: uuid
        start_time:
          type: string
          format: date-time
          description: RFC3339 timestamp for this scheduled game.
        game_mode_id:
          type: string
          format: uuid
          description: Must be a mode for the same game as this event group.

    UpdateEventGroupSettingsRequest:
      type: object
      required: [region, registration_open, events]
      properties:
        region:
          type: string
        sub_min:
          type: integer
          format: int32
          minimum: 0
        sort_logic:
          $ref: "#/components/schemas/SortLogic"
          description: Omit or send empty string to keep the current value.
        registration_open:
          type: boolean
        name:
          type: string
          maxLength: 50
          description: >
            Optional custom event-group title. Max 50 Unicode code points after trim.
            Disallows control characters and paired ASCII < and > (either alone is allowed).
            Omit or send empty/whitespace to clear (stored as null).
        events:
          type: array
          minItems: 1
          description: One entry per scheduled game in the group; each event_id must belong to this group.
          items:
            $ref: "#/components/schemas/PatchGroupEventScheduleItem"

    UpdateRegistrationStatusRequest:
      type: object
      properties:
        registration_open:
          type: boolean

    UpsertRegistrationRequest:
      type: object
      properties:
        can_substitute:
          type: boolean
        can_lobby_host:
          type: boolean
        duo_request:
          type: string
          description: Optional preferred duo player display name

    GroupRegistrationEventUpsertRequest:
      type: object
      required: [event_id, can_substitute, can_lobby_host]
      properties:
        event_id:
          type: string
          format: uuid
          description: UUID of the event to register for
        can_substitute:
          type: boolean
        can_lobby_host:
          type: boolean

    UpsertGroupRegistrationsRequest:
      type: object
      required: [events]
      properties:
        duo_request:
          type: string
          description: Optional preferred duo player display name
        events:
          type: array
          minItems: 1
          description: List of event registrations to upsert for the group
          items:
            $ref: "#/components/schemas/GroupRegistrationEventUpsertRequest"

    EventRegistration:
      type: object
      required: [event_id, user_id, discord_name, display_name, in_game_name, pronouns, current_rank_name, peak_rank_name, avg_rank_name, can_substitute, can_lobby_host, created_at, updated_at]
      properties:
        event_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        discord_name:
          type: string
        display_name:
          type: string
          description: User display name when set; otherwise empty.
        in_game_name:
          type: string
        pronouns:
          type: string
        current_rank_name:
          type: string
        peak_rank_name:
          type: string
        avg_rank_name:
          type: string
        can_substitute:
          type: boolean
        can_lobby_host:
          type: boolean
        duo_request:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EventGroupEvent:
      type: object
      required: [id, start_time, game_mode_id, game_mode_name, team_size, registered_count, lobbies_count, player_registered, registrations, lobbies, unplaced]
      properties:
        id:
          type: string
          format: uuid
        start_time:
          type: string
          format: date-time
        game_mode_id:
          type: string
          format: uuid
        game_mode_name:
          type: string
        team_size:
          type: integer
          format: int32
        registered_count:
          type: integer
          format: int32
        lobbies_count:
          type: integer
          format: int32
        player_registered:
          type: boolean
        registrations:
          type: array
          items:
            $ref: "#/components/schemas/EventRegistration"
        lobbies:
          type: array
          items:
            $ref: "#/components/schemas/EventLobby"
        unplaced:
          type: array
          description: Registered players not assigned to a team or sub pool. Populated for the event host only; empty for other viewers.
          items:
            $ref: "#/components/schemas/EventRegistration"

    LobbyPlayer:
      type: object
      required: [user_id, discord_name, display_name, in_game_name, pronouns, current_rank_name, current_rank_order, peak_rank_name, peak_rank_order, avg_rank_name, avg_rank_order, can_substitute, can_lobby_host, created_at, updated_at]
      properties:
        user_id:
          type: string
          format: uuid
        discord_name:
          type: string
        display_name:
          type: string
          description: User display name when set; otherwise empty.
        in_game_name:
          type: string
        pronouns:
          type: string
        current_rank_name:
          type: string
        current_rank_order:
          type: integer
          format: int32
        peak_rank_order:
          type: integer
          format: int32
        peak_rank_name:
          type: string
        avg_rank_name:
          type: string
        avg_rank_order:
          type: integer
          format: int32
        can_substitute:
          type: boolean
        can_lobby_host:
          type: boolean
        duo_request:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EventTeam:
      type: object
      required: [team_number, players]
      properties:
        team_number:
          type: integer
          format: int32
        players:
          type: array
          items:
            $ref: "#/components/schemas/LobbyPlayer"

    EventLobby:
      type: object
      required: [id, fairness_warning, fairness_warning_at_lock, teams, subs]
      properties:
        id:
          type: string
          format: uuid
        host_id:
          type: string
          format: uuid
          nullable: true
        join_code:
          type: string
          nullable: true
          description: >
            Plain lobby code, or invite path+query including leading slash
            (e.g. `/LOL?joinCode=…` or `/VAL?joinCode=…`). Game-agnostic single-segment
            paths are allowed; additional `/` in the path is not accepted yet (future
            consideration). Clients rebuild full URLs with join_link_base + join_code.
        fairness_warning:
          type: boolean
        fairness_warning_at_lock:
          type: boolean
          description: Whether the lobby was flagged unfair when teams were locked in (unchanged by manual roster edits).
        teams:
          type: array
          items:
            $ref: "#/components/schemas/EventTeam"
        subs:
          type: array
          items:
            $ref: "#/components/schemas/LobbyPlayer"

    EventGroupDetail:
      type: object
      required:
        - id
        - name
        - owner_id
        - owner_name
        - owner_display_name
        - owner_pronouns
        - game_mode_id
        - game_mode_name
        - game_id
        - game_name
        - team_size
        - sub_min
        - registration_open
        - region
        - sort_logic
        - created_at
        - updated_at
        - events
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
          description: >
            Optional custom event-group title. Max 50 Unicode code points after trim.
            Disallows control characters and paired ASCII < and > (either alone is allowed).
            Responses always include this field; "" means no custom name.
        owner_id:
          type: string
          format: uuid
        owner_name:
          type: string
        owner_display_name:
          type: string
          description: Host display name when set; otherwise empty.
        owner_pronouns:
          type: string
          description: Host pronouns when they opted into public display; otherwise empty.
        game_mode_id:
          type: string
          format: uuid
        game_mode_name:
          type: string
        game_id:
          type: string
          format: uuid
        game_name:
          type: string
        join_link_base:
          type: string
          nullable: true
          description: >
            HTTPS origin for this group's game (no trailing slash). Clients rebuild
            display URLs as join_link_base + lobby.join_code when join_code starts with /.
        team_size:
          type: integer
          format: int32
        sub_min:
          type: integer
          format: int32
        registration_open:
          type: boolean
        region:
          type: string
        sort_logic:
          $ref: "#/components/schemas/SortLogic"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventGroupEvent"

    CreateTeamsResponse:
      type: object
      required: [sub_capacity_adjusted]
      properties:
        sub_capacity_adjusted:
          type: boolean
          description: >
            True when matchmaking had to move substitute-eligible players off teams so each
            lobby could still meet the host's substitute minimum, and at least one lobby is
            still unfair afterward. False when those swaps did not run, or when every lobby
            ended fair (including after leftover rank-window repair).

    HealthResponse:
      type: object
      required: [status, message, timestamp]
      properties:
        status:
          type: string
          examples: ["ok"]
        message:
          type: string
          examples: ["API is running"]
        timestamp:
          type: string
          format: date-time
