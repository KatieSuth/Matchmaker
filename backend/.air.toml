# .air.toml — live-reload config for `air`
root = "."
tmp_dir = "tmp"

[build]
  cmd        = "go build -mod=vendor -o ./tmp/server ./cmd/server"
  bin        = "./tmp/server"
  full_bin   = "./tmp/server"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["assets", "tmp", "vendor"]
  delay      = 500 # ms

[log]
  time = true

[color]
  main    = "magenta"
  watcher = "cyan"
  build   = "yellow"
  runner  = "green"

[misc]
  clean_on_exit = true
